name: Respond to the Review

# When the review finishes on a build PR, the build answers it once
# (/philosophy:respond): it fixes or declines each finding with its reason, replies, and
# resolves the thread, so a PR whose findings are settled merges on its checks with
# nobody in between. One round: the review runs only when a PR is marked ready, so the
# push this makes starts no second review, and a finding it leaves for the owner stays
# open. Runs from main's copy of this file (workflow_run), never the PR's.

on:
  workflow_run:
    workflows: ["Claude Review"]
    types: [completed]

permissions: {}

jobs:
  respond:
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'build/')
    concurrency:
      group: respond-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - id: pr
        name: The build PR the review was for
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.event.workflow_run.head_branch }}
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$HEAD" --state open --json number --jq '.[0].number // empty')
          echo "number=$pr" >> "$GITHUB_OUTPUT"
          [ -n "$pr" ] || echo "No open PR for $HEAD; nothing to answer."

      # No persisted GITHUB_TOKEN: the action pushes with the Claude app's token. Nothing
      # before the action reads the repository with git, so a private one is fine too.
      - if: steps.pr.outputs.number != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          persist-credentials: false

      - if: steps.pr.outputs.number != ''
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - if: steps.pr.outputs.number != ''
        uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1.0.252
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The review ran on a ready event, which the build made as the Claude app.
          allowed_bots: "claude[bot],claude,github-actions[bot]"
          plugin_marketplaces: |
            https://github.com/bruk-io/knowhere.git
          plugins: |
            philosophy@knowhere
          prompt: /philosophy:respond ${{ steps.pr.outputs.number }}
          claude_args: |
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git:*),Bash(python3:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(bash .github/scripts/check.sh:*),Bash(uv:*),Bash(uvx:*)"

      - name: Keep the response's execution log
        if: always() && steps.pr.outputs.number != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: claude-respond-${{ steps.pr.outputs.number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/claude-execution-output.json
          if-no-files-found: ignore
          retention-days: 7
