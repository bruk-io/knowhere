name: Claude Review

# Runs /philosophy:review on each PR when it opens and on every push. Claude comments
# and never approves: the agent that wrote a change has no way to approve it. The job
# fails when the review finds anything Important, so as a required check it holds the
# merge until the finding is fixed (`@claude` on it starts the fix). PRs from forks get
# no secrets, so they are skipped rather than failed.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - id: review
        uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1.0.252
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The loop's own PRs come from the Claude app; without this they go unreviewed.
          allowed_bots: "claude[bot],claude"
          plugin_marketplaces: |
            https://github.com/bruk-io/knowhere.git
          plugins: |
            philosophy@knowhere
            authoring-kit@knowhere
          prompt: /philosophy:review ${{ github.event.pull_request.number }}
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            --json-schema '{"type":"object","properties":{"important":{"type":"integer","minimum":0},"nits":{"type":"integer","minimum":0}},"required":["important","nits"]}'

      # The review's whole run: every tool call, every denied one, and what it meant to
      # post. Kept a week, for when it counts findings it doesn't post.
      - name: Keep the review's execution log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: claude-review-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/claude-execution-output.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Hold the merge on Important findings
        env:
          COUNTS: ${{ steps.review.outputs.structured_output }}
        run: |
          important=$(printf '%s' "$COUNTS" | jq -r '.important // empty')
          if [ -z "$important" ]; then
            echo "The review returned no Important count, so it can't vouch for this PR."
            exit 1
          fi
          echo "Important findings: $important"
          if [ "$important" -gt 0 ]; then
            echo "An Important finding holds the merge. Fix it, or reply @claude on it."
            exit 1
          fi
