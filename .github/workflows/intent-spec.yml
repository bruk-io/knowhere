name: Intent to Spec

# When an intent merges into main, draft its spec (intent/self-running-loop/spec.md,
# R8). Merging the intent was the owner accepting it; the spec arrives as a PR, and
# CODEOWNERS holds it for the owner, because the spec is where the architecture is
# set. An intent that already has a spec is left alone.

on:
  push:
    branches: [main]
    paths:
      - "intent/*/intent.md"

permissions: {}

jobs:
  find:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      slugs: ${{ steps.find.outputs.slugs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: find
        name: Intents this push added or changed that have no spec yet
        run: |
          slugs=$(git diff --name-only --diff-filter=AM "${{ github.event.before }}" "${{ github.sha }}" -- 'intent/*/intent.md' \
            | cut -d/ -f2 | sort -u \
            | while read -r slug; do [ -f "intent/$slug/spec.md" ] || echo "$slug"; done \
            | jq -Rcs 'split("\n") | map(select(length > 0))')
          echo "slugs=$slugs" >> "$GITHUB_OUTPUT"
          echo "Intents to spec: $slugs"

  spec:
    needs: find
    if: needs.find.outputs.slugs != '[]'
    strategy:
      matrix:
        slug: ${{ fromJSON(needs.find.outputs.slugs) }}
    concurrency:
      group: intent-${{ matrix.slug }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1.0.252
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: |
            https://github.com/bruk-io/knowhere.git
          plugins: |
            philosophy@knowhere
          prompt: /philosophy:spec ${{ matrix.slug }}
          claude_args: |
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git:*),Bash(gh pr create:*),Bash(python3:*)"
