name: Checks

# The repository's full check on every PR, the one `.claude/checks.json` declares, so
# the evidence a merge rests on is CI's, not a session's account of it. It includes the
# artefact check, so a malformed intent, spec or plan can't merge.

on:
  pull_request:

permissions:
  contents: read

jobs:
  full-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - name: Full check
        run: bash .github/scripts/check.sh full
