name: Claude

# Answers @claude in issues, PR comments and reviews, from the repository's owner only:
# a reply on a build PR that stopped at a gated path is the owner unblocking it (spec
# R20), so nobody else's comment may do that. `@claude continue` on a build PR is
# build-continue.yml's, so it is left alone here. Claude pushes to the PR's branch or a new claude/ branch and opens a PR; it
# never merges. The marketplace's own plugins are installed, so a run here follows the
# same rules and hooks as a local session.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      github.actor == 'brukhabtu' &&
      !contains(github.event.comment.body, '@claude continue') && (
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1.0.252
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          plugin_marketplaces: |
            https://github.com/bruk-io/knowhere.git
          plugins: |
            philosophy@knowhere
            authoring-kit@knowhere
