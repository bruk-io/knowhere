name: Build the Next Change

# When a spec or a change merges into main, build the next change of that intent
# (intent/self-running-loop/spec.md, R9). `next-change` decides, not a model: the first
# change in the spec's delivery order with no plan on main, held while a build branch
# for it is open. One intent builds one change at a time. The build turns on auto-merge
# with the Claude app's token, so its merge starts `find` again (R11).
#
# Runs in two hops, because claude-code-action doesn't accept `push` as a triggering
# event (loop-trigger-events/spec.md R1): `find` computes the slugs on `push`, and a
# `dispatch` job relays them, with the push's range, as a `repository_dispatch`. The
# `build` job runs on that dispatch and re-checks the relay against `main` before
# anything runs (R5).

on:
  push:
    branches: [main]
    paths:
      - "intent/*/spec.md"
      - "intent/*/plans/*.md"
  repository_dispatch:
    types: [intent-build]

permissions: {}

jobs:
  find:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      slugs: ${{ steps.find.outputs.slugs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: find
        name: Intents whose spec or plans this push changed
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          slugs=$(git diff --name-only "$BEFORE" "$SHA" -- 'intent/*/spec.md' 'intent/*/plans/*.md' \
            | cut -d/ -f2 | sort -u | jq -Rcs 'split("\n") | map(select(length > 0))')
          echo "slugs=$slugs" >> "$GITHUB_OUTPUT"
          echo "Intents to build: $slugs"

  dispatch:
    needs: find
    if: "github.event_name == 'push' && needs.find.outputs.slugs != '[]'"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Relay the slugs and the push's range as a repository_dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SLUGS: ${{ needs.find.outputs.slugs }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          gh api repos/{owner}/{repo}/dispatches \
            -f event_type=intent-build \
            -f "client_payload[slugs]=$SLUGS" \
            -f "client_payload[before]=$BEFORE" \
            -f "client_payload[sha]=$SHA"

  build:
    if: github.event_name == 'repository_dispatch'
    strategy:
      matrix:
        slug: ${{ fromJSON(github.event.client_payload.slugs) }}
    concurrency:
      group: build-${{ matrix.slug }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: verify
        name: Check the dispatch is real
        env:
          SLUG: ${{ matrix.slug }}
          BEFORE: ${{ github.event.client_payload.before }}
          SHA: ${{ github.event.client_payload.sha }}
        run: python3 plugins/philosophy/scripts/dispatch-check build "$SLUG" --before "$BEFORE" --sha "$SHA"

      - id: next
        name: Which change is next
        env:
          SLUG: ${{ matrix.slug }}
        run: |
          set +e
          line=$(python3 plugins/philosophy/scripts/next-change "intent/$SLUG")
          code=$?
          echo "$line"
          echo "build=$([ $code -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          [ $code -le 1 ]

      - if: steps.next.outputs.build == 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - if: steps.next.outputs.build == 'true'
        uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1.0.252
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "github-actions[bot]"
          plugin_marketplaces: |
            https://github.com/bruk-io/knowhere.git
          plugins: |
            philosophy@knowhere
          prompt: /philosophy:build ${{ matrix.slug }} auto-merge
          claude_args: |
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git:*),Bash(gh pr create:*),Bash(gh pr ready:*),Bash(gh pr checks:*),Bash(gh pr merge:*),Bash(python3:*),Bash(bash .github/scripts/check.sh:*),Bash(uv:*),Bash(uvx:*)"
