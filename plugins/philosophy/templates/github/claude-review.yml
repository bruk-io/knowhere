name: Claude Review

# Runs /philosophy:review once a PR is ready: when it opens as ready, or moves from
# draft to ready. Pushes after that don't start it again; to review again, turn the PR
# back to a draft and mark it ready. Claude comments and never approves: the agent that
# wrote a change has no way to approve it. Its comments are the gate, because main
# requires every conversation to be resolved, so each finding, Important or nit, is
# answered and resolved before merge. The job also fails while the review finds
# anything Important. PRs from forks get no secrets, so they are skipped, not failed.

on:
  pull_request:
    types: [opened, ready_for_review]

jobs:
  review:
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      - id: started
        name: Note when the review started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - id: review
        uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1.0.252
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The loop's own PRs come from the Claude app; without this they go unreviewed.
          allowed_bots: "claude[bot],claude"
          plugin_marketplaces: |
            https://github.com/bruk-io/knowhere.git
          plugins: |
            philosophy@knowhere
            authoring-kit@knowhere
          prompt: /philosophy:review ${{ github.event.pull_request.number }}
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            --json-schema '{"type":"object","properties":{"important":{"type":"integer","minimum":0},"nits":{"type":"integer","minimum":0}},"required":["important","nits"]}'

      # The review's whole run: every tool call, every denied one, and what it meant to
      # post. Kept a week, for when it counts findings it doesn't post.
      - name: Keep the review's execution log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: claude-review-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/claude-execution-output.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Hold the merge on Important findings
        env:
          COUNTS: ${{ steps.review.outputs.structured_output }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          STARTED: ${{ steps.started.outputs.at }}
        run: |
          important=$(printf '%s' "$COUNTS" | jq -r '.important // empty')
          if [ -z "$important" ]; then
            # The action runs only a review workflow identical to main's, so a PR that
            # changes this file can't be reviewed by it. Say so rather than fail red;
            # .github/ waits for the owner through CODEOWNERS.
            if gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only | grep -qx '.github/workflows/claude-review.yml'; then
              echo "::notice::Not reviewed: this PR changes claude-review.yml, and the action only runs the version on main. The owner reviews it (CODEOWNERS)."
              exit 0
            fi
            echo "The review returned no Important count, so it can't vouch for this PR."
            exit 1
          fi
          # Counts with nothing posted means findings nobody can read or answer, and
          # every comment must be answered before merge, so that isn't a pass.
          # Read first, then count: a failed read stops the step with gh's own error
          # instead of counting as nothing posted.
          ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"claude[bot]\" and .created_at >= \"$STARTED\") | .id")
          if [ -z "$ids" ]; then
            echo "The review counted $COUNTS but posted no comment, so nobody can read or answer it. Its findings are in this run's execution log artifact."
            exit 1
          fi
          echo "Important findings: $important"
          if [ "$important" -gt 0 ]; then
            echo "An Important finding holds the merge. Fix it, or reply @claude on it."
            exit 1
          fi
