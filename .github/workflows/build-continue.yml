name: Continue a Build

# A build whose plan touches a gated path stops after the plan and asks the owner in its
# PR. The owner's reply `@claude continue` on that PR runs the build again on its own
# branch, where it picks up from the plan (intent/self-running-loop/spec.md, R6, R20).
# Only the owner's comment counts.

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  continue:
    if: |
      github.event.issue.pull_request &&
      github.actor == 'brukhabtu' &&
      contains(github.event.comment.body, '@claude continue')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - id: pr
        name: The PR's build branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh pr view "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --json headRefName --jq .headRefName)
          echo "head=$head" >> "$GITHUB_OUTPUT"
          if [[ "$head" =~ ^build/([^/]+)/[0-9]{2}$ ]]; then
            echo "slug=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "PR #${{ github.event.issue.number }} is on $head, not a build branch; nothing to continue."
          fi

      - if: steps.pr.outputs.slug != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.head }}

      - if: steps.pr.outputs.slug != ''
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - if: steps.pr.outputs.slug != ''
        uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1.0.252
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: |
            https://github.com/bruk-io/knowhere.git
          plugins: |
            philosophy@knowhere
          prompt: /philosophy:build ${{ steps.pr.outputs.slug }} auto-merge
          claude_args: |
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git:*),Bash(gh pr create:*),Bash(gh pr edit:*),Bash(gh pr ready:*),Bash(gh pr checks:*),Bash(gh pr merge:*),Bash(python3:*),Bash(bash .github/scripts/check.sh:*),Bash(uv:*),Bash(uvx:*)"
