name: Plan Drift

# Holds the review play's rule (R5) outside the model: the plan is what the owner read
# before the build, so a file a build changes beyond it was not read. Runs `plan-drift`
# on a build branch's PR and fails on anything it finds, with the reason in its output.
#
# Not yet a required check (spec, Areas of concern 1): until the owner marks it
# required in branch protection, it informs and does not hold the merge.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  plan-drift:
    if: startsWith(github.head_ref, 'build/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Check the branch against its plan
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git checkout -B "$HEAD_REF"
          python3 plugins/philosophy/scripts/plan-drift "$HEAD_REF"
