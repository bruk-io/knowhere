name: Philosophy Evals

# Runs the philosophy plugin's eval suite on every PR that changes the plugin, so a
# change to a play, a hook or a script that makes the loop behave worse holds the merge.
# The job runs on every PR and skips its own work when the plugin didn't change, so it
# can be a required check without blocking other PRs. Each case runs once, on the
# subscription token, and every case must pass.

on:
  pull_request:

permissions:
  contents: read

# A new push to the PR replaces a run still in progress, rather than stacking another.
concurrency:
  group: philosophy-evals-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  evals:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - id: changed
        name: Did the plugin change?
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
              | grep -qE '^(plugins/philosophy/|\.github/workflows/philosophy-evals\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "The philosophy plugin didn't change; nothing to evaluate."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.changed.outputs.run == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      # Pinned, so a new release can't reach the token or shift the results between runs.
      - if: steps.changed.outputs.run == 'true'
        name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.302

      # The eval runner refuses to give a case Bash without an OS sandbox, which on
      # Linux is bubblewrap with socat. Ubuntu 24.04 also stops unprivileged user
      # namespaces through AppArmor, which bubblewrap needs, so every sandboxed command
      # would fail; lift that on this throwaway runner.
      - if: steps.changed.outputs.run == 'true'
        name: Install the sandbox
        run: |
          sudo apt-get update -q && sudo apt-get install -y --no-install-recommends bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / --dev /dev true && echo "bubblewrap works"

      - if: steps.changed.outputs.run == 'true'
        name: Run the eval suite
        working-directory: plugins/philosophy
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: >
          claude plugin eval .
          --scaffold --trust-plugin
          --allow-tools Bash Write Edit
          --runs 1 --ablation none --threshold 1.0
          --no-publish --report eval-report.html
          --json eval-results.json --keep-temp

      # Print why each failed case failed, from its graders and its trace, so a failure in
      # CI can be read from the log instead of guessed at.
      - name: What the failed cases' tools said
        if: failure() && steps.changed.outputs.run == 'true'
        working-directory: plugins/philosophy
        run: |
          sudo chmod -R a+rX /tmp 2>/dev/null || true
          python3 ../../.github/scripts/eval-diagnostics.py eval-results.json

      - if: always() && steps.changed.outputs.run == 'true'
        name: Keep the report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: philosophy-eval-report
          path: plugins/philosophy/eval-report.html
          if-no-files-found: ignore
