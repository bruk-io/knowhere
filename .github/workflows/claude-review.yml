name: Claude Review

# Reviews each PR once it is ready: when it opens as ready, or moves from draft to ready.
# Pushes after that don't start it again; to review again, turn the PR back to a draft
# and mark it ready. Claude comments and never approves: the agent that wrote a change
# has no way to approve it, and the merge stays a person's call. PRs from forks get no
# secrets, so they are skipped rather than failed.

on:
  pull_request:
    types: [opened, ready_for_review]

jobs:
  review:
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1.0.252
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: |
            https://github.com/bruk-io/knowhere.git
          plugins: |
            philosophy@knowhere
            authoring-kit@knowhere
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. You did not write it, and you do not approve it.

            If REVIEW.md exists at the repository root, follow its passes and severity
            rules. Otherwise run three passes:
            - Bugs: logic errors, broken edge cases, regressions.
            - Security: injection, leaked secrets, workflow or hook permissions wider
              than the job needs.
            - Compliance: check the change against CLAUDE.md and the rules the
              repository and its plugins declare.

            Mark each finding Important (it breaks behaviour, leaks data, or breaches
            policy) or Nit. Report at most five nits and give the rest as a count. Skip
            whatever CI already checks.

            Put each finding on its line as an inline comment. Then leave one top-level
            comment with the verdict and the counts.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      # The review's whole run: every tool call, every denied one, and what it meant to
      # post. Kept a week, for when a review posts nothing.
      - name: Keep the review's execution log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: claude-review-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/claude-execution-output.json
          if-no-files-found: ignore
          retention-days: 7
