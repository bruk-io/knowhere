name: Build the Next Change

# When a spec or a change merges into main, build the next change of that intent
# (the philosophy plugin's loop). `next-change` decides, not a model: the first
# change in the spec's delivery order with no plan on main, held while a build branch
# for it is open. One intent builds one change at a time. The build turns on auto-merge
# with the Claude app's token, so its merge starts this workflow again (R11).

on:
  push:
    branches: [main]
    paths:
      - "intent/*/spec.md"
      - "intent/*/plans/*.md"

permissions: {}

jobs:
  find:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      slugs: ${{ steps.find.outputs.slugs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: find
        name: Intents whose spec or plans this push changed
        run: |
          slugs=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- 'intent/*/spec.md' 'intent/*/plans/*.md' \
            | cut -d/ -f2 | sort -u | jq -Rcs 'split("\n") | map(select(length > 0))')
          echo "slugs=$slugs" >> "$GITHUB_OUTPUT"
          echo "Intents to build: $slugs"

  build:
    needs: find
    if: needs.find.outputs.slugs != '[]'
    strategy:
      matrix:
        slug: ${{ fromJSON(needs.find.outputs.slugs) }}
    concurrency:
      group: build-${{ matrix.slug }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the plugin's scripts
        run: git clone -q --depth 1 https://github.com/bruk-io/knowhere.git "$RUNNER_TEMP/knowhere"

      - id: next
        name: Which change is next
        run: |
          set +e
          line=$(python3 "$RUNNER_TEMP/knowhere/plugins/philosophy/scripts/next-change" "intent/${{ matrix.slug }}")
          code=$?
          echo "$line"
          echo "build=$([ $code -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          [ $code -le 1 ]

      - if: steps.next.outputs.build == 'true'
        uses: astral-sh/setup-uv@v4

      - if: steps.next.outputs.build == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: |
            https://github.com/bruk-io/knowhere.git
          plugins: |
            philosophy@knowhere
          prompt: /philosophy:build ${{ matrix.slug }} auto-merge
          claude_args: |
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git:*),Bash(gh pr create:*),Bash(gh pr merge:*),Bash(python3:*),Bash(uv:*),Bash(uvx:*)"
