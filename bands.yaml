# Control bands over the loop itself (intent/self-running-loop/spec.md, R19). A
# scheduled workflow reads one value per day for each metric, and band-check says which
# tier the newest falls in against the days before it. CODEOWNERS holds this file for
# the owner: it says what the loop may do on its own.
baseline_days: 30
metrics:
  - name: ci_failure_rate
    describe: Share of finished CI runs that failed, per day
  - name: pr_cycle_hours
    describe: Mean hours from a PR opening to its merge, per day of merge
tiers:
  1sigma: log
  2sigma: diagnose
  3sigma: propose
