<script>
"use strict";
const R = JSON.parse(document.getElementById("data").textContent);
const $ = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v; else if (k === "text") el.textContent = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : String(kid));
  return el;
};
const fmt = (x, d = 2) => (x == null ? "-" : Number(x).toFixed(d));
const pct = x => (x == null ? "-" : Math.round(x * 100) + "%");
const money = x => (x == null ? "-" : "$" + Number(x).toFixed(2));
const threshold = R.run.threshold ?? 1;
const statusOf = s => (s == null ? ["na", "N/A"] : s >= threshold ? ["pass", "PASS"] : s > 0 ? ["part", "PART"] : ["fail", "FAIL"]);
const status = s => { const [c, w] = statusOf(s); return $("span", { class: "status " + c }, $("span", { class: "led" }), w); };
const bar = (s, cls = "") => $("span", { class: "bar " + cls }, $("i", { style: `width:${s == null ? 0 : Math.round(s * 100)}%` }));
const savedTheme = (() => { try { return localStorage.getItem("eval-theme"); } catch { return null; } })();
if (savedTheme) document.documentElement.dataset.theme = savedTheme;

function header() {
  const run = R.run, p = run.plugin || {};
  const toggle = $("button", { type: "button", onclick: () => {
    const dark = (document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")) === "dark";
    document.documentElement.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("eval-theme", document.documentElement.dataset.theme); } catch {}
  } }, "Toggle Theme");
  const tags = run.tagFilters && run.tagFilters.length ? "  ·  tags " + run.tagFilters.join(", ") : "";
  return $("header", { class: "run" },
    $("div", {},
      $("div", { class: "label" }, "EVAL RUN"),
      $("h1", {}, `${p.name || "plugin"} ${p.version ? "v" + p.version : ""}`),
      $("div", { class: "meta" }, `${(run.startedAt || "").replace("T", " ").slice(0, 19)} UTC  ·  Claude Code ${run.claudeVersion}  ·  ${run.durationSeconds}s  ·  ${money(run.costUsd)}  ·  model ${run.model || "default"}  ·  judge ${run.judgeModel || "default"}  ·  ${run.ablation}${tags}${run.partial ? "  ·  PARTIAL" : ""}`)),
    toggle);
}

function mean(xs) { const v = xs.filter(x => x != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; }

function tiles() {
  const by = k => R.cases.filter(c => c.kind === k);
  const cap = by("capability"), reg = by("regression"), cal = by("judge-calibration");
  const capW = mean(cap.map(c => c.with.score)), capO = mean(cap.map(c => c.without && c.without.score));
  const regW = mean(reg.map(c => c.with.score)), regO = mean(reg.map(c => c.without && c.without.score));
  const fired = R.cases.filter(c => c.fired), fc = fired.reduce((a, c) => a + c.fired.count, 0), fo = fired.reduce((a, c) => a + c.fired.of, 0);
  const t = (label, value, small, note) => $("div", { class: "tile" }, $("div", { class: "label" }, label),
    $("div", { class: "value" }, value, small ? $("small", {}, " " + small) : null), note ? $("div", { class: "note" }, note) : null);
  const out = [
    t("CAPABILITY", fmt(capW), capO == null ? "" : "vs " + fmt(capO) + " without", `${cap.length} cases where the kit should change the outcome`),
    t("REGRESSION", fmt(regW), regO == null ? "" : "vs " + fmt(regO) + " without", `${reg.length} cases plain Claude already passes`),
    t("CASES PASSED", `${R.aggregates.casesPassed ?? "-"}/${R.aggregates.casesTotal ?? "-"}`, "", `at threshold ${threshold}`),
    t("SKILL FIRED", fo ? pct(fc / fo) : "-", fo ? `${fc}/${fo} runs` : "", "with-plugin runs where the case's skill loaded"),
  ];
  if (cal.length) {
    const right = cal.filter(c => (c.with.score >= threshold) === (c.expected === "pass")).length;
    out.push(t("JUDGE CALIBRATION", `${right}/${cal.length}`, "", "labelled answers the judge scored as labelled"));
  }
  return $("section", { class: "tiles" }, out);
}

function skillsTable() {
  const kinds = ["capability", "regression"];
  const rows = R.skills.map(s => {
    const cells = kinds.flatMap(k => {
      const b = s.by[k];
      if (!b) return [$("td", { class: "num muted" }, "-"), $("td", { class: "num muted" }, "-"), $("td", { class: "num muted" }, "-")];
      const d = b.with != null && b.without != null ? b.with - b.without : null;
      return [$("td", { class: "num" }, `${fmt(b.with)}`), $("td", { class: "num muted" }, fmt(b.without)),
        $("td", { class: "num" + (d != null && d < 0 ? " worse" : "") }, d == null ? "-" : (d >= 0 ? "+" : "") + fmt(d))];
    });
    return $("tr", {}, $("td", { class: "mono" }, s.name), $("td", { class: "num" }, s.cases), ...cells,
      $("td", { class: "num" }, s.firedOf ? `${s.fired}/${s.firedOf}` : "-"));
  });
  return $("section", {}, $("h2", {}, "BY SKILL"),
    $("div", { class: "panel scroll" }, $("table", {},
      $("thead", {}, $("tr", {}, $("th", {}, "Skill"), $("th", { class: "num" }, "Cases"),
        $("th", { class: "num" }, "Cap with"), $("th", { class: "num" }, "w/out"), $("th", { class: "num" }, "Δ"),
        $("th", { class: "num" }, "Reg with"), $("th", { class: "num" }, "w/out"), $("th", { class: "num" }, "Δ"),
        $("th", { class: "num" }, "Fired"))),
      $("tbody", {}, rows))));
}

function graderGrid(c) {
  const runs = [...c.with.runs.map(r => ["W" + r.n, r]), ...(c.without ? c.without.runs.map(r => ["O" + r.n, r]) : [])];
  const head = $("tr", {}, $("th", {}, "Grader"), runs.map(([n]) => $("th", { class: "num", title: n[0] === "W" ? "with the plugin" : "without the plugin" }, n)));
  const body = c.graders.map(g => $("tr", {},
    $("td", { class: "mono" }, g.name, g.lintRule ? $("span", { class: "chip", style: "margin-left:6px", title: "mirrors lint rule " + g.lintRule }, g.lintRule) : null,
      g.type === "llm" ? $("span", { class: "chip", style: "margin-left:6px" }, "judge") : null),
    runs.map(([, r]) => {
      const v = r.graders.find(x => x.name === g.name);
      if (!v) return $("td", { class: "cell muted" }, "-");
      const [cls, word] = v.passed ? ["pass", "PASS"] : ["fail", "FAIL"];
      return $("td", { class: "cell", title: v.explanation + (v.scored ? "" : "  (indicator, not scored)") },
        $("span", { class: "status " + cls + (v.scored ? "" : " na") }, v.scored ? word : word.toLowerCase()));
    })));
  const failing = runs.flatMap(([n, r]) => r.graders.filter(v => !v.passed && v.scored).map(v => $("div", {},
    $("span", { class: "mono muted" }, `${n} ${v.name}: `), v.explanation, v.evidence && v.evidence !== v.explanation ? $("span", { class: "muted" }, "  " + v.evidence.slice(0, 300)) : null)));
  return $("div", {}, $("div", { class: "label" }, "GRADERS"),
    $("div", { class: "panel scroll", style: "margin-top:6px" }, $("table", { class: "grid-graders" }, $("thead", {}, head), $("tbody", {}, body))),
    failing.length ? $("div", { class: "explain", style: "margin-top:8px" }, $("div", { class: "label" }, "WHY THEY FAILED"), failing) : null);
}

const KIND = { session: "START", hook: "HOOK", think: "THINK", say: "SAY", tool: "TOOL", skill: "SKILL", end: "END" };

function trajectoryView(run) {
  const box = $("div", { class: "traj", role: "list" });
  if (!run.trajectory.length) { box.append($("div", { class: "empty" }, "No transcript was kept for this run.")); return box; }
  run.trajectory.forEach((s, i) => {
    const err = s.status === "error";
    const row = $("div", { class: `step ${s.kind} depth${s.depth}`, role: "listitem", tabindex: "0", "aria-expanded": "false" },
      $("span", { class: "n" }, i + 1), $("span", { class: "t" }, "+" + fmt(s.t, 1) + "s"),
      $("span", { class: "k" }, s.tool && s.kind === "tool" ? s.tool.toUpperCase().slice(0, 8) : KIND[s.kind] || s.kind),
      $("span", { class: "title", title: s.title }, s.title || ""),
      $("span", { class: "st status " + (err ? "fail" : "na") }, err ? "ERROR" : ""));
    let open = null;
    const toggle = () => {
      if (open) { open.remove(); open = null; row.setAttribute("aria-expanded", "false"); return; }

        s.body ? $("pre", {}, s.body + (s.truncated ? "\n... (cut)" : "")) : null,
        s.result != null && s.result !== "" ? $("div", {}, $("div", { class: "label" }, "RESULT"), $("pre", {}, s.result + (s.resultTruncated ? "\n... (cut)" : ""))) : null);

      row.after(open); row.setAttribute("aria-expanded", "true");
    };
    row.addEventListener("click", toggle);
    row.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });

  });
  return box;
}

function caseBody(c) {
  const runs = [...c.with.runs.map(r => ["WITH", r]), ...(c.without ? c.without.runs.map(r => ["W/OUT", r]) : [])];
  const slot = $("div", {});
  const buttons = runs.map(([arm, r], i) => {

      buttons.forEach(x => x.setAttribute("aria-pressed", "false")); b.setAttribute("aria-pressed", "true");
      slot.replaceChildren(trajectoryView(r));
    } }, `${arm} ${r.n}  ·  ${fmt(r.score)}  ·  ${r.turns ?? "?"} turns  ·  ${money(r.costUsd)}${r.error ? "  ·  error" : ""}`);
    return b;
  });
  if (runs.length) slot.append(trajectoryView(runs[0][1]));
  return $("div", { class: "casebody" },
    c.description ? $("div", { class: "muted" }, c.description) : null,
    $("div", {}, $("div", { class: "label" }, "PROMPT"), $("pre", { style: "margin-top:6px" }, c.prompt)),
    graderGrid(c),
    $("div", {}, $("div", { class: "label" }, "TRAJECTORY"),
      $("div", { class: "legend" }, "Each row is one step of the session. Select a row for its full input and result. SKILL marks the plugin's skill loading; ERROR marks a failed or denied tool."),
      $("div", { class: "runs", style: "margin:8px 0" }, buttons), slot));
}

function caseRow(c) {
  const d = c.delta;
  const det = $("details", { class: "case" },
    $("summary", {},
      status(c.with.score),
      $("span", { class: "name", title: c.name }, c.name),
      $("span", { class: "mono muted" }, c.skill),
      $("span", {}, $("span", { class: "chip" }, c.kind === "judge-calibration" ? "judge cal" : c.kind)),
      $("span", { class: "mono" }, bar(c.with.score, "with"), fmt(c.with.score)),
      $("span", { class: "mono muted" }, c.without ? [bar(c.without.score), fmt(c.without.score)] : "-"),
      $("span", { class: "mono" + (d != null && d < 0 ? " worse" : "") }, d == null ? "-" : (d >= 0 ? "+" : "") + fmt(d)),
      $("span", { class: "mono muted" }, c.fired ? `${c.fired.count}/${c.fired.of}` : "-")));
  let built = false;
  det.addEventListener("toggle", () => { if (det.open && !built) { det.append(caseBody(c)); built = true; } });
  return det;
}

function casesSection() {
  const skill = $("select", { "aria-label": "Skill" }, $("option", { value: "" }, "All skills"), R.skills.map(s => $("option", { value: s.name }, s.name)));
  const kind = $("select", { "aria-label": "Kind" }, $("option", { value: "" }, "All kinds"),
    [...new Set(R.cases.map(c => c.kind))].map(k => $("option", { value: k }, k)));
  const state = $("select", { "aria-label": "Status" }, $("option", { value: "" }, "Any result"),
    $("option", { value: "below" }, "Below threshold"), $("option", { value: "worse" }, "Kit made it worse"),
    $("option", { value: "unfired" }, "Skill did not fire"));
  const q = $("input", { type: "search", placeholder: "Filter by case name...", "aria-label": "Search cases" });
  const list = $("div", { class: "panel" });
  const head = $("div", { class: "casehead label" }, $("span", {}, "RESULT"), $("span", {}, "CASE"), $("span", {}, "SKILL"),
    $("span", {}, "KIND"), $("span", {}, "WITH"), $("span", {}, "W/OUT"), $("span", {}, "Δ"), $("span", {}, "FIRED"));
  const count = $("div", { class: "muted", style: "margin-top:6px" });
  const draw = () => {
    const shown = R.cases.filter(c =>
      (!skill.value || c.skill === skill.value) && (!kind.value || c.kind === kind.value) &&
      (!q.value || c.name.includes(q.value.trim())) &&
      (state.value !== "below" || (c.with.score ?? 0) < threshold) &&
      (state.value !== "worse" || (c.delta != null && c.delta < 0)) &&
      (state.value !== "unfired" || (c.fired && c.fired.count < c.fired.of)));
    list.replaceChildren(head, ...shown.map(caseRow));
    count.textContent = `${shown.length} of ${R.cases.length} cases`;
  };
  [skill, kind, state].forEach(el => el.addEventListener("change", draw)); q.addEventListener("input", draw);
  draw();
  return $("section", {}, $("h2", {}, "CASES"), $("div", { class: "filters" }, skill, kind, state, q), list, count);
}

document.getElementById("app").append(header(), tiles(), skillsTable(), casesSection(),
  $("p", { class: "muted", style: "margin-top:24px;font-size:12px" },
    `Generated from results.json (${R.schema}). Command: ${(R.run.command || []).join(" ")}`));
</script>
</body>
</html>
