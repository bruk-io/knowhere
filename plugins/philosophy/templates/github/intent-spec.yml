name: Intent to Spec

# When an intent merges into main, draft its spec (the philosophy plugin's loop).
# Merging the intent was the owner accepting it; the spec arrives as a PR, and
# CODEOWNERS holds it for the owner, because the spec is where the architecture is
# set. An intent that already has a spec is left alone.
#
# Runs in two hops, because claude-code-action doesn't accept `push` as a triggering
# event: `find` computes the slugs on `push`, and a `dispatch` job relays them, with
# the push's range, as a `repository_dispatch`. The `spec` job runs on that dispatch
# and re-checks the relay against `main` before anything runs.

on:
  push:
    branches: [main]
    paths:
      - "intent/*/intent.md"
  repository_dispatch:
    types: [intent-spec]

permissions: {}

jobs:
  find:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      slugs: ${{ steps.find.outputs.slugs }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - id: find
        name: Intents this push added or changed that have no spec yet
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          slugs=$(git diff --name-only --diff-filter=AM "$BEFORE" "$SHA" -- 'intent/*/intent.md' \
            | cut -d/ -f2 | sort -u \
            | while read -r slug; do [ -f "intent/$slug/spec.md" ] || echo "$slug"; done \
            | jq -Rcs 'split("\n") | map(select(length > 0))')
          echo "slugs=$slugs" >> "$GITHUB_OUTPUT"
          echo "Intents to spec: $slugs"

  dispatch:
    needs: find
    if: "github.event_name == 'push' && needs.find.outputs.slugs != '[]'"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Relay the slugs and the push's range as a repository_dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SLUGS: ${{ needs.find.outputs.slugs }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          gh api repos/{owner}/{repo}/dispatches \
            -f event_type=intent-spec \
            -f "client_payload[slugs]=$SLUGS" \
            -f "client_payload[before]=$BEFORE" \
            -f "client_payload[sha]=$SHA"

  spec:
    if: github.event_name == 'repository_dispatch'
    strategy:
      matrix:
        slug: ${{ fromJSON(github.event.client_payload.slugs) }}
    concurrency:
      group: intent-${{ matrix.slug }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Fetch the plugin's scripts
        run: git clone -q --depth 1 https://github.com/bruk-io/knowhere.git "$RUNNER_TEMP/knowhere"

      - id: verify
        name: Check the dispatch is real and the spec is still due
        env:
          SLUG: ${{ matrix.slug }}
          BEFORE: ${{ github.event.client_payload.before }}
          SHA: ${{ github.event.client_payload.sha }}
        run: |
          set +e
          python3 "$RUNNER_TEMP/knowhere/plugins/philosophy/scripts/dispatch-check" spec "$SLUG" --before "$BEFORE" --sha "$SHA"
          code=$?
          echo "due=$([ $code -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          [ $code -le 1 ]

      - if: steps.verify.outputs.due == 'true'
        uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1.0.252
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "github-actions[bot]"
          plugin_marketplaces: |
            https://github.com/bruk-io/knowhere.git
          plugins: |
            philosophy@knowhere
          prompt: /philosophy:spec ${{ matrix.slug }}
          claude_args: |
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git:*),Bash(gh pr create:*),Bash(python3:*)"
