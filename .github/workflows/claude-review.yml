name: Claude Review

# Reviews each PR when it opens and again on every push. Claude comments and never
# approves: the agent that wrote a change has no way to approve it, and the merge stays a
# person's call. PRs from forks get no secrets, so they are skipped rather than failed.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: |
            https://github.com/bruk-io/knowhere.git
          plugins: |
            philosophy@knowhere
            authoring-kit@knowhere
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. You did not write it, and you do not approve it.

            If REVIEW.md exists at the repository root, follow its passes and severity
            rules. Otherwise run three passes:
            - Bugs: logic errors, broken edge cases, regressions.
            - Security: injection, leaked secrets, workflow or hook permissions wider
              than the job needs.
            - Compliance: when the change belongs to an intent under intent/, check it
              against that intent.md, and against its spec.md and plan.md when they
              exist.

            Mark each finding Important (it breaks behaviour, leaks data, or breaches
            policy) or Nit. Report at most five nits and give the rest as a count. Skip
            whatever CI already checks.

            Put each finding on its line as an inline comment. Then leave one top-level
            comment with the verdict and the counts.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
