name: Philosophy Evals

# Runs the philosophy plugin's eval suite on every PR that changes the plugin, so a
# change to a play, a hook or a script that makes the loop behave worse holds the merge.
# Each case runs once, on the subscription token, and every case must pass.

on:
  pull_request:
    paths:
      - "plugins/philosophy/**"
      - ".github/workflows/philosophy-evals.yml"

permissions:
  contents: read

jobs:
  evals:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Pinned, so a new release can't reach the token or shift the results between runs.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.302

      # The eval runner refuses to give a case Bash without an OS sandbox, which on
      # Linux is bubblewrap with socat. Ubuntu 24.04 also stops unprivileged user
      # namespaces through AppArmor, which bubblewrap needs, so every sandboxed command
      # would fail; lift that on this throwaway runner.
      - name: Install the sandbox
        run: |
          sudo apt-get update -q && sudo apt-get install -y --no-install-recommends bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / --dev /dev true && echo "bubblewrap works"

      - name: Run the eval suite
        working-directory: plugins/philosophy
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: >
          claude plugin eval .
          --scaffold --trust-plugin
          --allow-tools Bash Write Edit
          --runs 1 --ablation none --threshold 1.0
          --no-publish --report eval-report.html
          --json eval-results.json --keep-temp

      # Print what a failed case's tools did and what failed, from the trace the eval's
      # JSON points at, so a failure in CI can be read from the log instead of guessed at.
      - name: What the failed cases' tools said
        if: failure()
        working-directory: plugins/philosophy
        run: |
          sudo chmod -R a+rX /tmp 2>/dev/null || true
          python3 - eval-results.json <<'PY'
          import json, os, sys
          results = json.load(open(sys.argv[1]))
          for case in results.get("cases", []):
              for run in case.get("arms", {}).get("with", []):
                  if run.get("passed"):
                      continue
                  print("== %s: %s" % (case["name"], run.get("error") or "graders failed"))
                  trace = run.get("tracePath") or ""
                  if not os.path.exists(trace):
                      print("  (no trace at %s)" % trace)
                      continue
                  for line in open(trace):
                      try:
                          event = json.loads(line)
                      except ValueError:
                          continue
                      message = event.get("message") if isinstance(event, dict) else None
                      blocks = message.get("content") if isinstance(message, dict) else None
                      for block in blocks if isinstance(blocks, list) else []:
                          if not isinstance(block, dict):
                              continue
                          if block.get("type") == "tool_use":
                              print("  tool:", block.get("name"), json.dumps(block.get("input", {}))[:200])
                          elif block.get("type") == "tool_result" and block.get("is_error"):
                              content = block.get("content")
                              text = content if isinstance(content, str) else json.dumps(content)
                              print("  ERROR:", text[:400].replace("\n", " "))
                          elif block.get("type") == "text" and event.get("type") == "assistant":
                              print("  said:", block.get("text", "")[:300].replace("\n", " "))
          PY

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: philosophy-eval-report
          path: plugins/philosophy/eval-report.html
          if-no-files-found: ignore
